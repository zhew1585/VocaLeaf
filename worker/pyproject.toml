[project]
name = "vocaleaf-worker"
version = "0.1.0"
description = "Stateless VocaLeaf book pipeline worker: pulls jobs from the API, never touches the database"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.44.5",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
]

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vocaleaf_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.isort]
known-first-party = ["vocaleaf_worker", "epub_factory"]

[tool.pyright]
include = ["src"]
