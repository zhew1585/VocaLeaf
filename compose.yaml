# Self-contained development stack (ADR 0003): `docker compose up`, then open http://localhost:8080.
# Images come from public.ecr.aws (Docker official image mirror) and ghcr.io, so no Docker Hub access is needed.
# Every external dependency is reached through environment variables only; to use Cloudflare R2,
# point the S3_* values at R2 and drop the `storage` service.
name: vocaleaf

x-s3: &s3
  S3_ENDPOINT: http://storage:9000
  S3_REGION: us-east-1
  S3_BUCKET: vocaleaf
  S3_ACCESS_KEY_ID: vocaleaf
  S3_SECRET_ACCESS_KEY: vocaleaf-dev-secret

x-worker-token: &worker-token
  WORKER_TOKEN: ${WORKER_TOKEN:-dev-worker-token-change-me}

services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:17-alpine
    environment:
      POSTGRES_USER: vocaleaf
      POSTGRES_PASSWORD: vocaleaf
      POSTGRES_DB: vocaleaf
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocaleaf"]
      interval: 2s
      timeout: 3s
      retries: 30
    # Only the API shares this network: the worker cannot reach the database at all (ADR 0002).
    networks: [db]

  # S3-compatible object storage (RustFS; MinIO no longer publishes community images).
  storage:
    image: ghcr.io/rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: vocaleaf
      RUSTFS_SECRET_KEY: vocaleaf-dev-secret
    volumes:
      - objects:/data
    networks: [storage]

  api:
    build: { context: ., dockerfile: api/Dockerfile }
    environment:
      <<: [*s3, *worker-token]
      DATABASE_URL: postgres://vocaleaf:vocaleaf@postgres:5432/vocaleaf
      # How long a worker holds a claimed job before another worker may take it over.
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-600}
    depends_on:
      postgres: { condition: service_healthy }
      storage: { condition: service_started }
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [db, storage, app]

  # Stateless: pulls jobs from the API, reads originals from and writes audio to storage; no database settings.
  worker:
    build: { context: worker }
    environment:
      <<: [*s3, *worker-token]
      API_URL: http://api:3000
      KOKORO_URL: http://kokoro:8880
      # Narration pauses in ms (technical config, PRD 4.7.2): between Sentences, between paragraphs, Chapter start.
      PAUSE_SENTENCE_MS: ${PAUSE_SENTENCE_MS:-300}
      PAUSE_PARAGRAPH_MS: ${PAUSE_PARAGRAPH_MS:-800}
      PAUSE_CHAPTER_START_MS: ${PAUSE_CHAPTER_START_MS:-1500}
    depends_on:
      api: { condition: service_healthy }
      kokoro: { condition: service_healthy }
    restart: on-failure
    networks: [app, storage]

  web:
    build: { context: ., dockerfile: web/Dockerfile }
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api: { condition: service_healthy }
    networks: [app]

  # Text-to-speech (Kokoro-FastAPI on CPU). Pinned by digest: the image carries the one unquantized model file
  # used everywhere (ADR 0003), kokoro-v1_0.pth from hexgrad/Kokoro-82M, sha256 496dba11...c17f.
  # DOWNLOAD_MODEL=false: never fetch weights at start, only use the ones inside the pinned image.
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.10.0@sha256:f54c5960c2b9387f6349080a9944f8bc7e8cdb98a4ef9238cb0b0f9ff9795f44
    environment:
      DOWNLOAD_MODEL: "false"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8880/health"]
      interval: 3s
      timeout: 3s
      retries: 60
    networks: [app]

networks:
  db: { internal: true }
  storage: {}
  app: {}

volumes:
  pgdata: {}
  objects: {}
